services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gridlock
      POSTGRES_PASSWORD: gridlock
      POSTGRES_DB: gridlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridlock"]
      interval: 3s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      # Overrides .env so the backend talks to the local db container
      DATABASE_URL: postgresql+psycopg://gridlock:gridlock@db:5432/gridlock
    volumes:
      - .:/app        # live code reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BROWSER: none
      WATCHPACK_POLLING: "true"                 # hot reload through the Mac mount
      REACT_APP_API_BASE: http://localhost:8000 # the browser calls the backend directly
    volumes:
      - ./package.json:/app/package.json
      - ./public:/app/public
      - ./src:/app/src
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gridlock
      POSTGRES_PASSWORD: gridlock
      POSTGRES_DB: gridlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridlock"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides .env so the backend talks to the local db container
      DATABASE_URL: postgresql+psycopg://gridlock:gridlock@db:5432/gridlock
    volumes:
      - ./backend:/app        # live code reload
      - ./data:/data          # Sperry PDFs + xlsx
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"   # hot reload on Mac/Windows mounts
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
